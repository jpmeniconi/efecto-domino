name: EfectoDomino
options:
  bundleIdPrefix: cl.jpmeniconi
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EfectoDomino:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EfectoDomino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.jpmeniconi.efectodomino
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dominó
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Dominó lee solo el calendario «Camila · Dominó» para encontrar espacios libres en su semana."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
      testTargets:
        - EfectoDominoTests
  EfectoDominoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EfectoDominoTests
    dependencies:
      - target: EfectoDomino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.jpmeniconi.efectodomino.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
