<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Dominó">
<!-- El ícono de Dominó (icono.svg) animado una vez, en 1,2 s: cuatro fichas de dominó se paran en fila
     y, una tras otra, cambian de forma con un rebote suave hasta ser las tres barras de la carta Gantt
     y el bloque de holgura. Animación SVG nativa: corre también dentro de <img>.
     Con Reducir movimiento se muestra el ícono quieto. -->
<style>
  .quieto { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .animado { display: none; }
    .quieto { display: inline; }
  }
</style>
